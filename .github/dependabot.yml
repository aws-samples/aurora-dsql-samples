version: 2
updates:
  - package-ecosystem: "dotnet-sdk"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "nuget"
    # NuGet follows solution and project references, so each build needs one
    # entry point. InventoryApi.IntegrationTests references the API project.
    directories:
      - "/dotnet/*"
      - "/dotnet/ef-core/examples/InventoryApi.IntegrationTests"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "gomod"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "maven"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "gradle"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "deno"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "pip"
    # pip reads requirement files one level down, so sample-level paths give
    # each manifest one update owner. "[!.]" distinguishes sample names from
    # ".", which Dependabot normalizes to the parent /python directory.
    directories:
      - "/python/[!.]*"
      - "/rust/lambda-employee-lookup/tests"
      - "/sample-amazon-aurora-dsql-agent/agent"
      - "/sample-amazon-aurora-dsql-agent/gateway"
      - "/sample-amazon-aurora-dsql-agent/lambda/grid_tools"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "composer"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "bundler"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "cargo"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Keep the approved MIT-licensed release; see gitleaks-scan.yml.
    ignore:
      - dependency-name: "gitleaks/gitleaks-action"
