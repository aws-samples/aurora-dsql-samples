version: 2
updates:
  - package-ecosystem: "dotnet-sdk"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "nuget"
    # Dependabot also updates every project a solution lists or a project
    # references, so each folder here is the top of one build: /dotnet/* finds
    # a sample's solution or project file, and the ef-core integration tests
    # reference the API project. A .NET sample laid out any other way needs
    # its own entry.
    directories:
      - "/dotnet/*"
      - "/dotnet/ef-core/examples/InventoryApi.IntegrationTests"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "gomod"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "maven"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "gradle"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "deno"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "pip"
    # Dependabot also reads requirement files one folder down, so a parent
    # such as /python would duplicate every update for the samples under it.
    # These are the sample folders themselves. "[!.]" stops the glob matching
    # /python/., which Dependabot reads as /python. A pip sample outside
    # /python needs its own entry.
    directories:
      - "/python/[!.]*"
      - "/rust/lambda-employee-lookup/tests"
      - "/sample-amazon-aurora-dsql-agent/agent"
      - "/sample-amazon-aurora-dsql-agent/gateway"
      - "/sample-amazon-aurora-dsql-agent/lambda/grid_tools"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "composer"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "bundler"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "cargo"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Keep the approved MIT-licensed release; see gitleaks-scan.yml.
    ignore:
      - dependency-name: "gitleaks/gitleaks-action"
