name: Ruby cluster management integration tests

permissions: {}

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.checkout-ref }}

    - name: Set up Ruby 3.3
      uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
      with:
        role-to-assume: ${{ secrets.RUBY_IAM_ROLE }}
        aws-region: us-east-1

    - name: Configure and run integration for cluster management
      working-directory: ./ruby/cluster_management
      run: |
        bundle install
        rspec

  cleanup:
    if: always()
    needs: test
    uses: ./.github/workflows/dsql-cluster-cleanup.yml
    with:
      run-id: ${{ github.run_id }}
      regions: us-east-1 us-east-2
    secrets:
      AWS_IAM_ROLE: ${{ secrets.RUBY_IAM_ROLE }}
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials
