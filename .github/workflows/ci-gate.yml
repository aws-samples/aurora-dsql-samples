  gate:
    name: gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - gitleaks
      - deps-review
      - cpp-cm
      - cpp-libpq
      - deno-booking-api
      - deno-postgresjs
      - dotnet-cm
      - dotnet-ef-core
      - dotnet-npgsql
      - go-cm
      - go-pgx
      - go-recipe-api
      - java-cm
      - java-pgjdbc
      - java-spring-boot
      - javascript-cm
      - javascript-node-postgres
      - javascript-postgresjs
      - lambda-nodejs
      - php-pdo-pgsql
      - python-asyncpg
      - python-cm
      - python-psycopg2
      - python-psycopg3
      - python-sqlalchemy
      - python-tortoise-orm
      - ruby-cm
      - ruby-pg
      - ruby-rails
      - ruby-rails-carrental
      - rust-cm
      - rust-sqlx
      - typescript-drizzle
      - typescript-prisma
      - typescript-sequelize
      - typescript-type-orm
    if: always()
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            for (const [job, result] of Object.entries(needs)) {
              if (result.result === 'failure' || result.result === 'cancelled') {
                core.setFailed(`Job ${job} ${result.result}`);
              }
            }

  integration-status:
    name: Report DSQL integration result
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [changes, gate]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v8
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_INTEGRATION: ${{ needs.changes.outputs.run-integration }}
        with:
          script: |
            const passed =
              process.env.RUN_INTEGRATION === 'true' &&
              process.env.GATE_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure',
