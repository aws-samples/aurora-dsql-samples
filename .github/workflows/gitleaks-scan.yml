name: Gitleaks scan

permissions: {}

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout-ref }}

    - name: gitleaks
      if: github.event_name != 'workflow_dispatch'
      # Keep the approved MIT-licensed release until an organization-managed license is configured.
      uses: gitleaks/gitleaks-action@518e4898c0cd1cc5d9aab6627a2eabd46e81d8da # v1.6.0
      env:
        # GitHub Token automatically created on run
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: gitleaks
      if: github.event_name == 'workflow_dispatch'
      uses: docker://zricethezav/gitleaks@sha256:ffe35a0d42974c19da37b3fb5ca1ff1e781ae6dffaf80164568129a2714eca61 # v7.4.0
      with:
        args: --path=/github/workspace --verbose --redact
