name: Go Recipe API integration tests

permissions: {}

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'go/recipe-sharing-api/**'
      - '.github/workflows/go-recipe-api-integ-tests.yml'

jobs:
  create-cluster:
    uses: ./.github/workflows/dsql-cluster-create.yml
    with:
      workflow_name: go-recipe-api
    secrets:
      AWS_IAM_ROLE: ${{ secrets.GO_IAM_ROLE }}
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  test:
    needs: create-cluster
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials
    env:
      GOPROXY: direct

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.checkout-ref }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26'

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
      with:
        role-to-assume: ${{ secrets.GO_IAM_ROLE }}
        aws-region: ${{ needs.create-cluster.outputs.region }}

    - name: Run integration tests
      working-directory: ./go/recipe-sharing-api
      env:
        DSQL_ENDPOINT: ${{ needs.create-cluster.outputs.cluster-endpoint }}
        REGION: ${{ needs.create-cluster.outputs.region }}
      run: |
        go test -v ./test/...

  delete-cluster:
    if: always() && needs.create-cluster.result == 'success'
    needs: [create-cluster, test]
    uses: ./.github/workflows/dsql-cluster-delete.yml
    with:
      cluster-id: ${{ needs.create-cluster.outputs.cluster-id }}
      region: ${{ needs.create-cluster.outputs.region }}
    secrets:
      AWS_IAM_ROLE: ${{ secrets.GO_IAM_ROLE }}
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials
