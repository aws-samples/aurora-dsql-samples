[package]
name = "dsql-employee-lookup"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"

[dependencies]
lambda_http = "0.13"
aurora-dsql-sqlx-connector = { version = "0.2", features = ["pool"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
base64 = "0.22"

[profile.release]
strip = true
lto = true
opt-level = "z"
