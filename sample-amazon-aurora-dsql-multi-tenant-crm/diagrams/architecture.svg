<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#232f3e"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#687078"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#232f3e">Multi-tenant CRM on Amazon Aurora DSQL</text>

  <!-- AWS Cloud boundary -->
  <rect x="210" y="55" width="720" height="350" rx="8" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="224" y="75" font-size="13" font-weight="bold" fill="#232f3e">AWS Cloud</text>

  <!-- Tenant clients -->
  <g>
    <rect x="30" y="180" width="150" height="90" rx="6" fill="#f2f6fc" stroke="#4b6584" stroke-width="1.5"/>
    <circle cx="105" cy="212" r="14" fill="#e7911e"/>
    <text x="105" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#232f3e">Tenant clients</text>
    <text x="105" y="261" text-anchor="middle" font-size="11" fill="#4b6584">(X-Tenant-Id)</text>
  </g>

  <!-- ECS Express Mode cluster -->
  <rect x="240" y="95" width="330" height="270" rx="8" fill="#fbf3ea" stroke="#ed7100" stroke-width="1.5"/>
  <text x="256" y="115" font-size="12.5" font-weight="bold" fill="#ed7100">Amazon ECS Express Mode (AWS Fargate)</text>

  <!-- ALB -->
  <rect x="270" y="135" width="270" height="70" rx="6" fill="#ffffff" stroke="#8c4fff" stroke-width="1.5"/>
  <rect x="284" y="150" width="30" height="30" rx="4" fill="#8c4fff"/>
  <text x="405" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#232f3e">Application Load Balancer</text>
  <text x="405" y="182" text-anchor="middle" font-size="11" fill="#4b6584">HTTPS public endpoint</text>

  <!-- Fargate app -->
  <rect x="270" y="245" width="270" height="90" rx="6" fill="#ffffff" stroke="#ed7100" stroke-width="1.5"/>
  <rect x="284" y="260" width="30" height="30" rx="4" fill="#ed7100"/>
  <text x="410" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#232f3e">Express.js CRM API</text>
  <text x="410" y="292" text-anchor="middle" font-size="10.5" fill="#4b6584">tenant-scoped repositories</text>
  <text x="410" y="307" text-anchor="middle" font-size="10.5" fill="#4b6584">OCC retry on SQLSTATE 40001</text>

  <!-- ALB -> app -->
  <line x1="405" y1="205" x2="405" y2="243" stroke="#232f3e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="418" y="228" font-size="10.5" fill="#4b6584">&#8594; :3000</text>

  <!-- ECS task role -->
  <rect x="620" y="115" width="150" height="70" rx="6" fill="#eef7ee" stroke="#3f8624" stroke-width="1.5"/>
  <rect x="634" y="130" width="26" height="26" rx="4" fill="#3f8624"/>
  <text x="702" y="145" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#232f3e">ECS task role</text>
  <text x="702" y="161" text-anchor="middle" font-size="10.5" fill="#4b6584">dsql:DbConnect</text>

  <!-- AWS IAM -->
  <rect x="620" y="215" width="150" height="60" rx="6" fill="#eef7ee" stroke="#3f8624" stroke-width="1.5"/>
  <rect x="634" y="228" width="26" height="26" rx="4" fill="#c7275f"/>
  <text x="705" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#232f3e">AWS IAM</text>
  <text x="705" y="258" text-anchor="middle" font-size="10.5" fill="#4b6584">validates token</text>

  <!-- Aurora DSQL -->
  <rect x="620" y="300" width="290" height="80" rx="6" fill="#eef1fb" stroke="#3334b9" stroke-width="1.5"/>
  <rect x="634" y="318" width="28" height="28" rx="4" fill="#3334b9"/>
  <text x="785" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#232f3e">Amazon Aurora DSQL</text>
  <text x="785" y="347" text-anchor="middle" font-size="10.5" fill="#4b6584">pooled: shared schema,</text>
  <text x="785" y="361" text-anchor="middle" font-size="10.5" fill="#4b6584">tenant_id per row</text>

  <!-- clients -> ALB -->
  <line x1="180" y1="200" x2="268" y2="175" stroke="#232f3e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="196" y="180" font-size="10.5" fill="#4b6584">HTTPS</text>

  <!-- app -> task role (assumes) -->
  <line x1="540" y1="270" x2="618" y2="165" stroke="#232f3e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="556" y="212" font-size="10.5" fill="#4b6584">assumes</text>

  <!-- task role -> IAM (signs token) -->
  <line x1="695" y1="185" x2="695" y2="213" stroke="#232f3e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="705" y="203" font-size="10" fill="#4b6584">signs IAM token</text>

  <!-- IAM -> DSQL (validates, dashed) -->
  <line x1="705" y1="275" x2="720" y2="298" stroke="#687078" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowDash)"/>

  <!-- app -> DSQL (IAM-authenticated SQL) -->
  <path d="M 540 305 C 575 340, 590 345, 618 342" fill="none" stroke="#232f3e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="548" y="332" font-size="10.5" fill="#232f3e">IAM-authenticated SQL (TLS)</text>

  <text x="480" y="428" text-anchor="middle" font-size="10.5" fill="#687078">No database password anywhere: the task role signs a short-lived IAM token; AWS IAM validates it on the connection.</text>
</svg>
